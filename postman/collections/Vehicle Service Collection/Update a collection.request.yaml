$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: "1"
body:
  type: json
  content: |-
    {
      "nickName": "The Lisa Marie",
      "vin": "4M2DV11W4RDJ53329",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected status code is 200', function () {
          pm.response.to.have.status(200);
      })
    language: text/javascript
examples: ./.resources/Update a collection.resources/examples
order: 3000
