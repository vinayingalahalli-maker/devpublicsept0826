$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: "0"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected status code is 200', function () {
          pm.response.to.have.status(200);
      })
    language: text/javascript
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
