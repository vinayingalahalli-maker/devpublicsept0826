$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  id: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected status code is 204', function () {
          pm.response.to.have.status(204);
      })
    language: text/javascript
examples: ./.resources/Delete a vehicle.resources/examples
order: 4000
